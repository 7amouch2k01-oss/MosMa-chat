services:
  - type: web
    name: mosma-chat
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false          # You will paste your Atlas URI in the Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value
      - key: CLIENT_URL
        sync: false          # Set to your Render service URL once deployed, e.g. https://mosma-chat.onrender.com
